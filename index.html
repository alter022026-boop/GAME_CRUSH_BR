<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1130" />
<meta name="description" content="Crush BR: jogo de combinar peças com 120 fases, inspirado no Brasil." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Crush BR" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Crush BR — jogo de combinar</title>
<style>
:root{--night:#0b1130;--cream:#fff8e8;--gold:#ffd36a;--pink:#ff7aa8;--mint:#6fe7bd;--sky:#8cc8ff;--w1:#3d5a9e;--w2:#1c2c63;
--adh:58px;--bs:max(270px,min(calc(100vw - 26px),500px,calc(100dvh - 365px - var(--adh))))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{color:var(--cream);font-family:"Baloo 2","Fredoka","Nunito",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:700;
background:radial-gradient(120% 70% at 50% -8%,var(--w1) 0,var(--w2) 48%,var(--night) 92%) fixed;overflow:hidden;user-select:none;-webkit-user-select:none;transition:background .6s}
button{font-family:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}

/* ---------- botões ---------- */
.icon{width:44px;height:44px;flex:none;border-radius:15px;border:1px solid #ffffff30;background:linear-gradient(#ffffff26,#ffffff0a);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #0a1030b0;transition:transform .08s,box-shadow .08s}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1030b0}
.btn{border:0;border-radius:18px;padding:13px 22px;font-size:17px;font-weight:900;color:#4a2350;cursor:pointer;background:linear-gradient(#ffe08a,#ff9f5c);box-shadow:0 5px 0 #c4642f,0 10px 22px #0006,inset 0 2px 0 #fffa;text-shadow:0 1px 0 #ffffff80;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c4642f,0 4px 10px #0006,inset 0 2px 0 #fffa}
.btn.mint{background:linear-gradient(#b3f7dc,#3fc796);color:#0e4a37;box-shadow:0 5px 0 #1d8363,0 10px 22px #0006,inset 0 2px 0 #fffa}
.btn.mint:active{box-shadow:0 1px 0 #1d8363,0 4px 10px #0006,inset 0 2px 0 #fffa}
.btn.ghost{background:linear-gradient(#ffffff2a,#ffffff10);color:#fff;text-shadow:none;box-shadow:0 5px 0 #0a1030b0,inset 0 1px 0 #ffffff45}
.btn.ghost:active{box-shadow:0 1px 0 #0a1030b0}
.btn[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.btn.wide{width:100%}

/* ---------- mapa ---------- */
.maphead{width:min(100%,560px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px,env(safe-area-inset-top)) 14px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#37d974,#ffe03a);color:#06471f;box-shadow:0 5px 0 #0b7a35,0 8px 20px #ffe03a50;font-size:19px;letter-spacing:-1px;transform:rotate(-5deg);flex:none}
.brand h1{font-size:clamp(17px,4.6vw,25px);margin:0;line-height:1;letter-spacing:-.4px;text-shadow:0 2px 0 #0007;white-space:nowrap}
.brand p{margin:4px 0 0;font-size:11px;color:#c7d3f2;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:7px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 11px;border-radius:14px;border:1px solid #ffffff30;background:linear-gradient(#ffffff26,#ffffff0a);color:#fff;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #0a1030b0}
.pill i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--mint);color:#0e4a37;font-size:15px;line-height:1}
.pill.st{color:var(--gold);cursor:default}
.coin{width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#d98e04);box-shadow:inset 0 -2px 0 #b8710a,0 0 0 2px #ffe58a55;display:inline-block;flex:none}
#mapScroll{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;margin:0 auto}
.trail{position:absolute;inset:0;pointer-events:none}
.trail .t1{fill:none;stroke:#0a1235;stroke-width:22;stroke-linecap:round;opacity:.55}
.trail .t2{fill:none;stroke:#ffffff55;stroke-width:5;stroke-linecap:round;stroke-dasharray:2 13}
.ribbon{position:absolute;left:50%;transform:translateX(-50%);padding:5px 16px;border-radius:12px;background:linear-gradient(#7a5cff,#4a35b8);font-size:12px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 0 #2a1a78,0 8px 18px #0005;border:1px solid #ffffff40}
.node{position:absolute;width:60px;height:60px;border-radius:50%;transform:translate(-50%,-50%);border:0;cursor:pointer;font-size:22px;font-weight:900;color:#fff;display:grid;place-items:center;text-shadow:0 2px 0 #0006;transition:transform .12s}
.node:active{transform:translate(-50%,-47%)}
.node.locked{background:radial-gradient(circle at 35% 28%,#69739a,#3b4468);box-shadow:0 5px 0 #20274a,inset 0 2px 0 #ffffff30;color:#aab3d4;cursor:default}
.node.done{background:radial-gradient(circle at 35% 28%,#ffe9a0,#ffb347 60%,#e9801f);box-shadow:0 5px 0 #a8530f,0 8px 18px #0005,inset 0 2px 0 #fff9;color:#5a2d0a;text-shadow:0 1px 0 #fff8}
.node.cur{background:radial-gradient(circle at 35% 28%,#c5fbe5,#4fe0a8 55%,#1ea777);box-shadow:0 5px 0 #0f6f4d,0 0 0 5px #6fe7bd44,0 10px 26px #0006,inset 0 2px 0 #fffb;color:#073a29;text-shadow:0 1px 0 #fff9;width:68px;height:68px;animation:nodePulse 1.6s ease-in-out infinite}
.node .nst{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:1px;color:var(--gold);text-shadow:0 2px 0 #000a;white-space:nowrap}
.node .nst s{text-decoration:none;color:#ffffff40}
.node .pointer{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:12px;background:#fff;color:#073a29;padding:3px 9px;border-radius:10px;animation:bob 1s ease-in-out infinite;text-shadow:none}
.node .pointer:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes nodePulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}

/* ---------- jogo ---------- */
#game{justify-content:center;gap:0;overflow-y:auto;padding:max(6px,env(safe-area-inset-top)) 0 max(8px,env(safe-area-inset-bottom))}
.gwrap{width:min(100%,540px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px}
.gtop{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gtitle{text-align:center;line-height:1.05}
.gtitle small{display:block;font-size:11px;color:#c3d0f0;letter-spacing:1.2px;text-transform:uppercase}
.gtitle b{font-size:21px;text-shadow:0 2px 0 #0007}
.hud{width:100%;display:grid;grid-template-columns:74px 1fr 92px;gap:8px;align-items:stretch}
.moves,.scorebox{border-radius:18px;border:1px solid #ffffff30;background:linear-gradient(#ffffff22,#ffffff08);box-shadow:0 4px 0 #0a1030a0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px}
.moves b{font-size:30px;line-height:1;text-shadow:0 2px 0 #0007}
.moves small,.scorebox small{font-size:9px;letter-spacing:1.2px;color:#bfcdee}
.moves.low b{color:#ff8fa5;animation:lowPulse .7s ease-in-out infinite}
.scorebox b{font-size:21px;line-height:1.15;color:var(--gold);text-shadow:0 2px 0 #0007}
@keyframes lowPulse{50%{transform:scale(1.18)}}
.goals{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;border-radius:18px;border:1px solid #ffffff30;background:linear-gradient(#ffffff1c,#ffffff06);padding:6px;box-shadow:0 4px 0 #0a1030a0}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:14px;background:#0a1235aa;border:1px solid #ffffff1c;min-width:62px}
.chip .ci{width:28px;height:28px;display:grid;place-items:center;font-size:19px;color:var(--gold);flex:none}
.chip .ci svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px #0008)}
.chip b{font-size:17px;text-shadow:0 1px 0 #0008}
.chip.done{background:#1e6b52cc;border-color:#6fe7bd88}
.chip.done b{color:#9ff5d3}
.ico.jelly{display:block;width:22px;height:22px;border-radius:7px;background:radial-gradient(circle at 30% 25%,#ffd4ec,#ff8cc8 60%,#d9569f);box-shadow:inset 0 0 0 2px #fff7}
.bar{position:relative;width:100%;height:14px;border-radius:10px;background:#070d28;box-shadow:inset 0 2px 4px #000a;margin:4px 0 6px}
.bar .fill{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#6fe7bd,#ffe07a,#ff9fc4);transition:width .4s;box-shadow:0 0 12px #ffe07a88}
.bar .st{position:absolute;top:50%;transform:translate(-50%,-52%);font-size:22px;color:#46507a;text-shadow:0 2px 0 #0008;transition:.3s}
.bar .st.on{color:var(--gold);animation:starOn .5s;text-shadow:0 0 12px #ffd36a,0 2px 0 #0008}
@keyframes starOn{40%{transform:translate(-50%,-52%) scale(1.7) rotate(20deg)}}

.frame{position:relative;width:var(--bs);height:var(--bs);padding:2.2%;border-radius:26px;background:linear-gradient(145deg,#7a8fe0,#33448f 45%,#1b2556);box-shadow:0 22px 50px #040a2490,inset 0 2px 0 #ffffff60,inset 0 -3px 0 #0a123a}
.frame:before{content:"";position:absolute;inset:-5px;border-radius:30px;background:linear-gradient(145deg,#ffe48a55,transparent 40%,#ff9fc455);z-index:-1;filter:blur(8px)}
.board{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#111c47,#0a1233);box-shadow:inset 0 4px 16px #000b;touch-action:none}
.board.shake{animation:shake .45s}
@keyframes shake{10%,50%,90%{transform:translate(-3px,2px)}30%,70%{transform:translate(3px,-2px)}}
.slot{position:absolute;width:12.5%;height:12.5%;left:calc(var(--c)*12.5%);top:calc(var(--r)*12.5%)}
.slot:before{content:"";position:absolute;inset:1.5px;border-radius:24%;background:#ffffff0d}
.slot.b:before{background:#ffffff18}
.jl{position:absolute;inset:1.5px;border-radius:24%;opacity:0;background:radial-gradient(circle at 30% 25%,#ffd4ec,#ff8cc8 62%,#d9569f);transition:opacity .35s,box-shadow .35s}
.slot[data-j="1"] .jl{opacity:.5}
.slot[data-j="2"] .jl{opacity:.82;box-shadow:inset 0 0 0 3px #fff8,0 0 10px #ff8cc888}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transform:translate(calc(var(--x)*100%),calc(var(--y)*100%));transition:transform var(--d,.2s) var(--ease,ease),opacity .12s;will-change:transform;z-index:2}
.tile .in{position:absolute;inset:6%;transition:transform .15s,filter .15s}
.tile .in svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px #0009)}
.tile.sel .in{transform:scale(1.14);filter:brightness(1.18) drop-shadow(0 0 7px #fff);animation:selBob .6s ease-in-out infinite}
@keyframes selBob{50%{transform:scale(1.2) rotate(4deg)}}
.tile.pop .in{animation:pop .26s ease-in forwards}
@keyframes pop{35%{transform:scale(1.35);filter:brightness(2.2)}100%{transform:scale(.05) rotate(40deg);opacity:0}}
.tile.born .in{animation:born .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes born{0%{transform:scale(.1);filter:brightness(3)}60%{transform:scale(1.35);filter:brightness(1.8)}100%{transform:scale(1)}}
.tile.hint .in{animation:hint .7s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.25);filter:brightness(1.4) drop-shadow(0 0 8px #fff)}}
.tile.hit .in{animation:hit .3s}
@keyframes hit{30%{transform:scale(.82) rotate(-6deg);filter:brightness(1.8)}}
.k-h .in svg,.k-v .in svg{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 3px 2px #0009);animation:glow 1.2s ease-in-out infinite}
.k-w .in{animation:wrap 1s ease-in-out infinite}
.k-b .in{animation:floaty 1.8s ease-in-out infinite}
.k-b .spr{transform-origin:50px 50px;animation:spin 3.5s linear infinite}
.k-ing .in:before{content:"";position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(#ffe58a99,transparent 70%)}
@keyframes glow{50%{filter:drop-shadow(0 0 11px #fff) brightness(1.2) drop-shadow(0 3px 2px #0009)}}
@keyframes wrap{50%{transform:scale(1.12)}}
@keyframes floaty{50%{transform:translateY(-6%) scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
.beam{position:absolute;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,#fff,#ffe9a0,#fff,transparent);filter:drop-shadow(0 0 8px #fff);opacity:0}
.beam.row{left:0;width:100%;height:12.5%;animation:beamR .5s ease-out}
.beam.col{top:0;height:100%;width:12.5%;background:linear-gradient(180deg,transparent,#fff,#ffe9a0,#fff,transparent);animation:beamC .5s ease-out}
@keyframes beamR{0%{opacity:1;transform:scaleX(0)}40%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1) scaleY(.2)}}
@keyframes beamC{0%{opacity:1;transform:scaleY(0)}40%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1) scaleX(.2)}}
.ring{position:absolute;z-index:4;width:12.5%;height:12.5%;border-radius:50%;pointer-events:none;border:5px solid #fff;box-shadow:0 0 18px #ffe08a,inset 0 0 18px #ffe08a;opacity:0;animation:ring .5s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(5)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.float{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);font-size:clamp(16px,4.6vw,24px);font-weight:900;color:#fff;text-shadow:0 0 8px #ff9fc4,0 2px 0 #000a;animation:floatUp .9s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.praise{position:absolute;left:50%;top:44%;z-index:8;pointer-events:none;transform:translate(-50%,-50%) scale(0);font-size:clamp(30px,9vw,50px);font-weight:900;letter-spacing:-1px;color:#fff;white-space:nowrap;text-shadow:0 4px 0 #c4306a,0 0 24px #ff7aa8,0 8px 20px #000a;-webkit-text-stroke:2px #8a1f55;paint-order:stroke fill;opacity:0}
.praise.show{animation:praise 1.1s ease-out forwards}
.praise.big{color:#ffe9a0;text-shadow:0 4px 0 #c4642f,0 0 28px #ffb347,0 8px 20px #000a;-webkit-text-stroke:2px #8a4a0f}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(3deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.msg{min-height:20px;font-size:13px;text-align:center;color:#dbe5ff;max-width:var(--bs)}
.boosters{display:flex;gap:10px;justify-content:center;margin-top:2px}
.bst{position:relative;width:78px;padding:8px 4px 6px;border-radius:18px;border:1px solid #ffffff30;background:linear-gradient(#ffffff26,#ffffff0a);color:#fff;cursor:pointer;box-shadow:0 4px 0 #0a1030b0;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s}
.bst:active{transform:translateY(3px)}
.bst .bi{font-size:25px;line-height:1.1}
.bst small{font-size:10px;letter-spacing:.3px;color:#c9d6f5}
.bst .cnt{position:absolute;top:-7px;right:-5px;min-width:23px;height:23px;border-radius:12px;background:linear-gradient(#ff9fc4,#ff5d8f);display:grid;place-items:center;font-size:13px;box-shadow:0 2px 0 #9d2459;padding:0 5px}
.bst.empty .cnt{background:linear-gradient(#9fb0ee,#5b6cc2);box-shadow:0 2px 0 #2c3a7f}
.bst.on{background:linear-gradient(#ffe9a0,#ffb347);color:#4a2350;box-shadow:0 4px 0 #c4642f,0 0 18px #ffd36a;animation:bstOn .8s ease-in-out infinite}
.bst.on small{color:#5a2d0a}
@keyframes bstOn{50%{transform:scale(1.07)}}

/* ---------- modais ---------- */
#modalHost{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:#050a22cc;backdrop-filter:blur(7px)}
#modalHost.show{display:grid}
.modal{width:min(100%,380px);max-height:100%;overflow-y:auto;padding:26px 22px 22px;text-align:center;border-radius:28px;border:1px solid #ffffff3a;background:linear-gradient(160deg,#34478a,#1b2658 60%,#141c46);box-shadow:0 26px 70px #000a,inset 0 2px 0 #ffffff40;animation:modalIn .35s cubic-bezier(.3,1.5,.5,1);position:relative}
@keyframes modalIn{from{transform:scale(.6) translateY(30px);opacity:0}}
.modal h2{margin:2px 0 6px;font-size:28px;text-shadow:0 3px 0 #0007;letter-spacing:-.5px}
.modal p{margin:6px 0;color:#d0daf5;line-height:1.45;font-size:14px;font-weight:600}
.modal .world{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#aebdea}
.modal .gr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 6px}
.modal .tip{background:#0a1235aa;border-radius:16px;padding:10px 12px;font-size:13px;color:#e6edff;margin:12px 0;border:1px dashed #ffffff30;line-height:1.4;font-weight:600}
.modal .meta{font-size:13px;color:#cbd7f6;margin-bottom:12px}
.modal .meta b{color:var(--gold);font-size:17px}
.modal .row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.modal .row.h{flex-direction:row}
.modal .row.h .btn{flex:1;padding:13px 8px}
.bigstars{display:flex;justify-content:center;gap:4px;margin:8px 0 2px}
.bigstars span{font-size:62px;line-height:1;color:#3a4678;text-shadow:0 4px 0 #0008}
.bigstars span:nth-child(2){transform:translateY(-12px)}
.bigstars span.on{color:var(--gold);text-shadow:0 0 22px #ffd36a,0 4px 0 #a8530f;animation:bigStar .7s cubic-bezier(.3,1.7,.5,1) both}
@keyframes bigStar{0%{transform:scale(0) rotate(-120deg)}100%{transform:scale(1) rotate(0)}}
.bigstars span:nth-child(2).on{animation-delay:.35s}.bigstars span:nth-child(3).on{animation-delay:.7s}.bigstars span:nth-child(1).on{animation-delay:.05s}
.reward{display:flex;gap:10px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.reward div{display:flex;align-items:center;gap:6px;background:#0a1235aa;padding:7px 12px;border-radius:14px;font-size:15px}
.shop{display:flex;flex-direction:column;gap:9px;margin-top:12px;text-align:left}
.shopi{display:flex;align-items:center;gap:11px;background:#0a1235aa;border-radius:16px;padding:9px 11px;border:1px solid #ffffff1c}
.shopi .bi{font-size:30px;width:42px;text-align:center}
.shopi div{flex:1;line-height:1.15}.shopi small{display:block;color:#b9c7ea;font-size:11px;font-weight:600}
.shopi .btn{padding:9px 13px;font-size:14px;display:flex;align-items:center;gap:6px}
.gift{font-size:60px;animation:bob2 1.2s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px) rotate(6deg)}}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;z-index:30;padding:11px 18px;border-radius:16px;background:#fff;color:#2a1a58;font-weight:800;font-size:14px;box-shadow:0 10px 30px #0008;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
@media(max-height:690px){.hud{grid-template-columns:66px 1fr 82px}.moves b{font-size:25px}.gtitle b{font-size:18px}.bst{width:70px;padding:5px 3px 4px}.bst .bi{font-size:21px}.bar{margin:2px 0 3px}.msg{min-height:16px}:root{--bs:max(240px,min(calc(100vw - 26px),500px,calc(100dvh - 320px - var(--adh))))}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#app{position:fixed;inset:0 0 calc(var(--adh) + env(safe-area-inset-bottom)) 0}
#adBar{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(var(--adh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;align-items:center;background:#050a22e6;border-top:1px solid #ffffff1f}
.adslot{width:min(320px,100%);height:50px;display:grid;place-items:center;border-radius:8px;border:1px dashed #ffffff40;font-size:11px;color:#9fb0d8;font-weight:600;overflow:hidden}

<script>
(()=>{
'use strict';
const N=8, LEVELS=120;
const FAST=/[?&]fast/.test(location.search), SPEED=FAST?0.02:1;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const rnd=n=>Math.floor(Math.random()*n);
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const idx=(r,c)=>r*N+c;
const D4=[[1,0],[-1,0],[0,1],[0,-1]];

/* ================= SAVE ================= */
const SAVE_KEY='jardimEstrelasV2';
const defSave=()=>({v:2,lives:5,lifeT:0,wins:0,unlocked:1,stars:{},best:{},coins:120,boost:{hammer:2,swap:2,moves:2},sound:true,daily:'',streak:0});

if(location.hash==='#unlock'){save.unlocked=LEVELS;persist()}
const PRICE={hammer:60,swap:70,moves:90};
const BNAME={hammer:'Martelo',swap:'Troca livre',moves:'+5 jogadas'};
const BICON={hammer:'🔨',swap:'🔀',moves:'➕'};

/* ================= SONS ================= */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',v=.06,slide=0,delay=0){
  if(!save.sound)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);

const SC=[0,2,4,7,9,12,14,16,19,21,24];

  special:()=>[0,1,2,3].forEach(i=>tone(note(i+3),.14,'triangle',.05,1,i*.05)),
  stripe:()=>tone(1000,.32,'sawtooth',.035,.22),
  boom:()=>{tone(130,.45,'sawtooth',.07,.3);tone(65,.55,'sine',.1,.5)},

/* ================= GRÁFICOS (SVG) ================= */
const COLORS=[
 {m:'#ff5d8f',l:'#ffc7da',d:'#b81257'},{m:'#4db5ff',l:'#cdeaff',d:'#1257b8'},{m:'#45dca0',l:'#c9f9e3',d:'#0d8a58'},
 {m:'#ffd23f',l:'#fff5bb',d:'#d08000'},{m:'#b57cff',l:'#e9dbff',d:'#6229c4'},{m:'#ff9a3c',l:'#ffdab0',d:'#cf4c06'}];
const SHAPES=[
 'M50 90 C18 68 6 49 6 32 C6 17 18 8 31 8 C40 8 47 13 50 21 C53 13 60 8 69 8 C82 8 94 17 94 32 C94 49 82 68 50 90 Z',
 'M50 5 L92 40 L50 95 L8 40 Z',
 'M50 5 L90 27 L90 73 L50 95 L10 73 L10 27 Z',
 'M50 4 L62 35 L95 37 L69 58 L78 90 L50 72 L22 90 L31 58 L5 37 L38 35 Z',
 'M50 5 C50 5 85 40 85 62 C85 81 70 95 50 95 C30 95 15 81 15 62 C15 40 50 5 50 5 Z',
 'M28 10 H72 Q90 10 90 28 V72 Q90 90 72 90 H28 Q10 90 10 72 V28 Q10 10 28 10 Z'];
(function buildDefs(){

    s+=`<radialGradient id="g${i}" cx=".34" cy=".28" r=".85"><stop offset="0" stop-color="${c.l}"/><stop offset=".42" stop-color="${c.m}"/><stop offset="1" stop-color="${c.d}"/></radialGradient>`;

  });
  s+='<radialGradient id="gb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8a6cff"/><stop offset=".55" stop-color="#2c1d68"/><stop offset="1" stop-color="#120b33"/></radialGradient>';
  s+='<radialGradient id="gc" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff9aae"/><stop offset=".5" stop-color="#e0213f"/><stop offset="1" stop-color="#8d0f32"/></radialGradient>';
  s+='<linearGradient id="gi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eefaff"/><stop offset=".5" stop-color="#9edaff"/><stop offset="1" stop-color="#4f9fe4"/></linearGradient>';
  s+='</defs></svg>';

})();
const STRIPE_H='<g stroke="#fff" stroke-opacity=".88" stroke-width="7" stroke-linecap="round"><line x1="20" y1="34" x2="80" y2="34"/><line x1="16" y1="50" x2="84" y2="50"/><line x1="20" y1="66" x2="80" y2="66"/></g>';
const STRIPE_V='<g stroke="#fff" stroke-opacity=".88" stroke-width="7" stroke-linecap="round"><line x1="34" y1="20" x2="34" y2="80"/><line x1="50" y1="16" x2="50" y2="84"/><line x1="66" y1="20" x2="66" y2="80"/></g>';
const WRAP='<rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="11 8" stroke-opacity=".95"/><rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="#ffd36a" stroke-width="2" stroke-opacity=".9"/>';
const BOMB_SVG=(()=>{const cols=['#ff5d8f','#ffd23f','#45dca0','#4db5ff','#b57cff','#ff9a3c'];let s='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="url(#gb)" stroke="#fff" stroke-opacity=".55" stroke-width="3"/><g class="spr">';
  for(let i=0;i<12;i++){const a=i*Math.PI/6,r1=15+(i%2)*7,r2=r1+14;s+=`<line x1="${(50+Math.cos(a)*r1).toFixed(1)}" y1="${(50+Math.sin(a)*r1).toFixed(1)}" x2="${(50+Math.cos(a)*r2).toFixed(1)}" y2="${(50+Math.sin(a)*r2).toFixed(1)}" stroke="${cols[i%6]}" stroke-width="7" stroke-linecap="round"/>`}
  return s+'</g><circle cx="50" cy="50" r="8" fill="#fff" fill-opacity=".92"/><ellipse cx="33" cy="27" rx="13" ry="7" fill="#fff" fill-opacity=".5" transform="rotate(-32 33 27)"/></svg>'})();
const CHERRY_SVG='<svg viewBox="0 0 100 100"><path d="M52 14C60 30 66 46 70 62M52 14C44 30 36 46 32 62" stroke="#3a8c3f" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M52 14c10-8 24-6 30 2-12 4-22 2-30-2z" fill="#58c25f" stroke="#2f7a34" stroke-width="2"/><circle cx="31" cy="69" r="21" fill="url(#gc)" stroke="#8d0f32" stroke-width="3"/><circle cx="71" cy="67" r="21" fill="url(#gc)" stroke="#8d0f32" stroke-width="3"/><ellipse cx="24" cy="61" rx="6" ry="4" fill="#fff" fill-opacity=".75" transform="rotate(-30 24 61)"/><ellipse cx="64" cy="59" rx="6" ry="4" fill="#fff" fill-opacity=".75" transform="rotate(-30 64 59)"/></svg>';
function iceSVG(p){const cr=p.max>1&&p.hp<p.max;
  return `<svg viewBox="0 0 100 100"><rect x="7" y="7" width="86" height="86" rx="20" fill="url(#gi)" stroke="#f2fbff" stroke-width="${p.hp>1?6:3.5}"/><rect x="17" y="17" width="66" height="66" rx="13" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/><path d="M22 25L44 20" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-opacity=".85"/><path d="M50 30v40M30 50h40M36 36l28 28M64 36L36 64" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>${cr?'<path d="M62 8L52 34L66 46L50 70L58 92" fill="none" stroke="#2b6fb0" stroke-width="3.5" stroke-linejoin="round"/>':''}</svg>`}
function pieceSVG(p){
  if(p.k==='b')return BOMB_SVG;
  if(p.k==='ing')return CHERRY_SVG;
  if(p.k==='ice')return iceSVG(p);
  let s=`<svg viewBox="0 0 100 100"><use href="#gem${p.t}"/>`;
  if(p.k==='h')s+=STRIPE_H;else if(p.k==='v')s+=STRIPE_V;else if(p.k==='w')s+=WRAP;
  return s+'</svg>';
}
const gemIcon=t=>`<svg viewBox="0 0 100 100"><use href="#gem${t}"/></svg>`;

/* ================= FASES ================= */
const WORLDS=[['Amazônia','#1f8a4c','#0b3b2a'],['Pantanal','#3f9a5a','#12403a'],['Lençóis Maranhenses','#4ea6d8','#14407a'],['Cataratas do Iguaçu','#2c9aa0','#0e3a6a'],['Rio de Janeiro','#e08a2c','#2a2f7c'],['Carnaval','#c0449a','#3a1a6a'],['Sertão','#d08a3a','#5a2a3e'],['Salvador','#d2563f','#3d1a4a'],['Fernando de Noronha','#1fa0c8','#0e2656'],['Festa Junina','#e0a030','#4a2040'],['Gramado','#6fa0d8','#23306e'],['Brasília','#2f6fd0','#0a1a50']];
const MASKS={
 full:['........','........','........','........','........','........','........','........'],
 cut:['##....##','#......#','........','........','........','........','#......#','##....##'],
 heart:['.##..##.','........','........','........','#......#','##....##','###..###','########'],
 pyr:['###..###','##....##','#......#','#......#','........','........','........','........'],
 funnel:['........','........','........','#......#','#......#','##....##','###..###','###..###'],
 narrow:['#......#','#......#','#......#','#......#','#......#','#......#','#......#','#......#']
};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildLevel(n,spec,R){
  const mask=MASKS[spec.mask].map(s=>[...s].map(ch=>ch!=='#'));
  const jelly=mask.map(r=>r.map(()=>0)),ice=mask.map(r=>r.map(()=>0));
  const cells=[];mask.forEach((row,r)=>row.forEach((ok,c)=>{if(ok)cells.push([r,c])}));
  if(spec.jelly){const{from=0,hp=1,hp2from=99,dens=1}=spec.jelly;cells.forEach(([r,c])=>{if(r>=from&&(dens>=1||R()<dens))jelly[r][c]=r>=hp2from?2:hp})}
  if(spec.ice){const pool=cells.filter(([r])=>r>=2&&r<=N-2);for(let i=pool.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    pool.slice(0,spec.ice.n).forEach(([r,c])=>{ice[r][c]=spec.ice.hp})}
  let jellyN=0,iceN=0;jelly.forEach(r=>r.forEach(v=>{if(v>0)jellyN++}));ice.forEach(r=>r.forEach(v=>{if(v>0)iceN++}));
  const goals=Object.assign({},spec.goals);if(jellyN)goals.jelly=true;if(iceN)goals.ice=true;
  const B=spec.moves*190,r100=x=>Math.round(x/100)*100;
  const s2=r100(Math.max(B*.95,(goals.score||0)*1.5)),s3=r100(Math.max(B*1.45,(goals.score||0)*2.2));
  const t1=goals.score||r100(s2*.6);
  return{n,world:Math.floor((n-1)/10),moves:spec.moves,colors:spec.colors,mask,jelly,ice,goals,tip:spec.tip||'',stars:[t1,s2,s3],jellyN,iceN};
}
const HAND={
 1:{mask:'full',colors:4,moves:20,goals:{score:2200},tip:'Toque numa peça e depois numa vizinha (ou arraste) para trocar de lugar. Junte 3 ou mais iguais!'},
 2:{mask:'full',colors:5,moves:22,goals:{score:3800},tip:'4 peças iguais em linha criam uma Peça Listrada: ela limpa uma linha ou coluna inteira!'},
 3:{mask:'cut',colors:5,moves:22,goals:{collect:[{t:1,n:16}]},tip:'Colete a quantidade pedida de cristais azuis combinando-os.'},
 4:{mask:'cut',colors:5,moves:22,jelly:{from:4,hp:1},goals:{},tip:'Combine peças sobre a geleia mágica para limpá-la por completo.'},
 5:{mask:'full',colors:5,moves:24,goals:{score:6000},tip:'5 em linha criam a Bomba Estelar (troque com uma peça para limpar aquela cor). Formas em L ou T criam a Peça Embrulhada: explosão 3×3!'},
 6:{mask:'full',colors:5,moves:24,ice:{n:6,hp:1},goals:{},tip:'Quebre os blocos de gelo combinando peças ao lado deles.'},
 7:{mask:'pyr',colors:5,moves:28,goals:{ing:2},tip:'Leve as cerejas até o fundo do tabuleiro limpando as peças abaixo delas.'},
 8:{mask:'heart',colors:5,moves:28,jelly:{from:1,hp:1,hp2from:4},goals:{},tip:'Geleia dupla precisa ser limpa duas vezes!'}
};
const MASK_POOL=['full','cut','heart','pyr','funnel','narrow'];
const LCACHE={};
function getLevel(n){
  if(LCACHE[n])return LCACHE[n];
  const R=mulberry(n*2654435761>>>0),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),d=Math.min(1,(n-1)/119),h=Math.max(0,(n-60)/60);
  let spec;
  if(HAND[n])spec=HAND[n];
  else{
    const type=n>40&&(n%4===0)?'expert':['score','collect','jelly','ice','ing','mix'][(n-9)%6];
    const colors=n<16?5:(R()<.45+.45*d?6:5);
    const pick=()=>MASK_POOL[Math.floor(R()*MASK_POOL.length)];
    if(type==='score'){const moves=Math.round(26-8*d)+ri(-1,2);spec={mask:pick(),colors,moves,goals:{score:Math.ceil(moves*170*(.64+.6*d)/100)*100}}}
    else if(type==='collect'){const two=d>.3,three=d>.7&&colors>5,moves=Math.round(26-5*d)+ri(0,2);const a=ri(0,colors-1);let b=(a+1+ri(0,colors-2))%colors;
      let c3=(b+1+ri(0,colors-2))%colors;if(c3===a||c3===b)c3=(b+1)%colors;if(c3===a)c3=(a+2)%colors;const coll=three?[{t:a,n:Math.round(8+9*d)},{t:b,n:Math.round(8+9*d)},{t:c3,n:Math.round(8+9*d)}]:two?[{t:a,n:Math.round(8+10*d)},{t:b,n:Math.round(8+10*d)}]:[{t:a,n:Math.round(13+14*d)}];spec={mask:pick(),colors,moves,goals:{collect:coll}}}
    else if(type==='jelly'){const m=pick(),from=ri(2,4),hp2=d>.25?ri(Math.max(2,4-Math.floor(d*3)),5):99;spec={mask:m,colors,goals:{},jelly:{from,hp:1,hp2from:hp2}};
      const tmp=buildLevel(n,Object.assign({moves:20},spec),R);spec.moves=Math.min(36,Math.max(20,Math.round((20+(tmp.jellyN+(hp2<99?tmp.jellyN*.4:0))*.3)*(1-.12*d))))}
    else if(type==='ice'){const cnt=Math.round(5+11*d)+ri(0,2);spec={mask:pick(),colors,moves:Math.round((22+cnt*.8)*(1-.1*d)),goals:{},ice:{n:cnt,hp:d>.4?2:1}}}
    else if(type==='ing'){const cnt=2+Math.floor(d*5);spec={mask:['full','funnel','pyr','cut'][ri(0,3)],colors,moves:Math.round((22+cnt*3)*(1-.08*d)),goals:{ing:cnt}}}
    else if(type==='expert'){const mm=['cut','heart','pyr','funnel','full'][ri(0,4)],moves=Math.round(34-5*d)+ri(0,2),v=ri(0,2);
      if(v===0)spec={mask:mm,colors:6,moves,jelly:{from:3,hp:1,hp2from:5},ice:{n:Math.round(4+4*d),hp:2},goals:{}};
      else if(v===1)spec={mask:mm,colors:6,moves,ice:{n:Math.round(5+4*d),hp:2},goals:{collect:[{t:ri(0,5),n:Math.round(10+8*d)},{t:ri(0,5),n:Math.round(8+6*d)}].filter((x,i,a)=>a.findIndex(y=>y.t===x.t)===i)}};
      else spec={mask:mm==='narrow'?'full':mm,colors:6,moves,jelly:{from:4,hp:1},goals:{ing:3+Math.floor(d*3)}}}
    else{const mm=pick(),moves=Math.round(30-4*d)+ri(0,2);const v=ri(0,2);
      if(v===0)spec={mask:mm,colors,moves,jelly:{from:3,hp:1},goals:{collect:[{t:ri(0,colors-1),n:Math.round(10+7*d)}]}};
      else if(v===1)spec={mask:mm,colors,moves,ice:{n:Math.round(5+5*d),hp:1},goals:{score:Math.ceil(moves*170*(.45+.3*d)/100)*100}};
      else spec={mask:mm==='narrow'?'full':mm,colors,moves:moves+2,goals:{ing:2+Math.floor(d*2),score:Math.ceil(moves*170*.4/100)*100}}}
  }
  return LCACHE[n]=buildLevel(n,spec,R);
}
function goalChips(L,live){
  const chip=(ico,txt,done)=>`<div class="chip${done?' done':''}"><span class="ci">${ico}</span><b>${txt}</b></div>`;
  let h='';const G=L.goals;
  if(G.score){const ok=live&&S.score>=G.score;h+=chip('★',ok?'✓':fmt(G.score),ok)}

  if(G.jelly){const left=live?S.jellyLeft:L.jellyN;h+=chip('<span class="ico jelly"></span>',left>0?left:'✓',left<=0)}

function findRuns(){
  const runs=[],ok=(r,c)=>isNormalish(S.P[r][c]);
  for(let r=0;r<N;r++){let c=0;while(c<N){if(!ok(r,c)){c++;continue}const t=S.P[r][c].t;let e=c+1;while(e<N&&ok(r,e)&&S.P[r][e].t===t)e++;
    if(e-c>=3){const cells=[];for(let k=c;k<e;k++)cells.push(idx(r,k));runs.push({cells,dir:'h',t,len:e-c})}c=e}}
  for(let c=0;c<N;c++){let r=0;while(r<N){if(!ok(r,c)){r++;continue}const t=S.P[r][c].t;let e=r+1;while(e<N&&ok(e,c)&&S.P[e][c].t===t)e++;
    if(e-r>=3){const cells=[];for(let k=r;k<e;k++)cells.push(idx(k,c));runs.push({cells,dir:'v',t,len:e-r})}r=e}}
  return runs;
}
function planRuns(runs,ctx){
  const set=new Set(),cre=[],used=new Set(),taken=new Set();
  runs.forEach(r=>r.cells.forEach(i=>set.add(i)));
  const pick=r=>{if(ctx){if(r.cells.includes(ctx.a))return ctx.a;if(r.cells.includes(ctx.b))return ctx.b}return r.cells[r.cells.length>>1]};
  runs.forEach((r,i)=>{if(r.len>=5){const a=pick(r);cre.push({idx:a,k:'b',t:-1});used.add(i);taken.add(a)}});
  for(let i=0;i<runs.length;i++){if(used.has(i)||runs[i].dir!=='h')continue;
    for(let j=0;j<runs.length;j++){if(used.has(j)||runs[j].dir!=='v'||runs[j].t!==runs[i].t)continue;
      const common=runs[i].cells.find(x=>runs[j].cells.includes(x));
      if(common!==undefined&&!taken.has(common)){cre.push({idx:common,k:'w',t:runs[i].t});used.add(i);used.add(j);taken.add(common);break}}}
  runs.forEach((r,i)=>{if(used.has(i)||r.len!==4)return;let a=pick(r);if(taken.has(a)){a=r.cells.find(x=>!taken.has(x));if(a===undefined)return}
    cre.push({idx:a,k:r.dir==='h'?'v':'h',t:r.t});taken.add(a)});
  return{set,creations:cre};
}
function expand(init){
  const cleared=new Set(),fx=[],stack=[...init];let trig=0;
  while(stack.length){
    const i=stack.pop();if(cleared.has(i))continue;const r=i>>3,c=i&7,p=S.P[r][c];if(!p||p.k==='ing')continue;
    cleared.add(i);if(p.used||p.k==='n'||p.k==='ice')continue;
    trig++;
    if(p.k==='h'){fx.push({type:'row',r});for(let k=0;k<N;k++)stack.push(idx(r,k))}
    else if(p.k==='v'){fx.push({type:'col',c});for(let k=0;k<N;k++)stack.push(idx(k,c))}
    else if(p.k==='w'){fx.push({type:'ring',r,c});for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nc>=0&&nr<N&&nc<N)stack.push(idx(nr,nc))}}
    else if(p.k==='b'){const cand=[];for(let a=0;a<N;a++)for(let b=0;b<N;b++){const q=S.P[a][b];if(q&&q.k==='n'&&q.t>=0)cand.push(q.t)}
      if(cand.length){const t=cand[rnd(cand.length)],targets=[];for(let a=0;a<N;a++)for(let b=0;b<N;b++){const q=S.P[a][b];if(q&&q.t===t&&isNormalish(q)){stack.push(idx(a,b));targets.push([a,b])}}fx.push({type:'bolt',r,c,targets})}}
  }
  return{cleared,fx,trig};
}
async function applyClear(ex,creations,chain,opts={}){

  cleared.forEach(i=>{if(at(i).k!=='ice')removed.push(i)});
  let n=0,sr=0,sc=0,pieces=0;
  removed.forEach(i=>{
    const r=i>>3,c=i&7,p=S.P[r][c];if(!p)return;
    if(isNormalish(p)&&p.t>=0)S.g.collect.forEach(g=>{if(g.t===p.t&&g.have<g.n)g.have++});

    else{S.P[r][c]=null;removeTile(p,true)}
  });
  renderJelly();

  if(n)floatText(sr/n,sc/n,'+'+fmt(gain));

function dropAll(){
  let maxD=0,changed=false;const nt=[];
  for(let c=0;c<N;c++){
    const t=S.top[c],bt=S.bot[c];if(t<0)continue;let w=bt;
    for(let r=bt;r>=t;r--){const p=S.P[r][c];if(p){if(r!==w){S.P[w][c]=p;S.P[r][c]=null;maxD=Math.max(maxD,w-r);changed=true}w--}}
    const cnt=w-t+1;
    for(let k=0;k<cnt;k++){const r=t+k,p=spawnPiece();S.P[r][c]=p;nt.push([p,r,c,cnt])}
    if(cnt>0){changed=true;maxD=Math.max(maxD,cnt)}
  }
  nt.forEach(([p,r,c,cnt])=>mkTile(p,r,c,cnt));
  if(nt.length)void boardEl.offsetHeight;
  if(changed)sync();
  return changed?maxD:0;
}

  if(G.ing&&S.ingSpawned<G.ing.n){let onB=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.P[r][c]&&S.P[r][c].k==='ing')onB++;
    const p=.05+.3*(1-S.moves/S.L.moves);if(onB<3&&Math.random()<p){S.ingSpawned++;return newPiece(-3,'ing')}}

    if(p&&p.k==='ing'){S.P[bt][c]=null;const el=tiles.get(p.id);tiles.delete(p.id);if(el){el.classList.add('pop');setTimeout(()=>el.remove(),300)}

function moveWorks(a,b){

    if(r+1<N&&S.P[r+1][c]&&moveWorks(idx(r,c),idx(r+1,c)))return[idx(r,c),idx(r+1,c)];

async function activateCombo(a,b){

     top:[],bot:[],jellyLeft:L.jellyN,iceLeft:L.iceN,ingSpawned:0,contCount:0,
     g:{score:L.goals.score||0,collect:(L.goals.collect||[]).map(x=>({t:x.t,n:x.n,have:0})),jelly:!!L.goals.jelly,ice:!!L.goals.ice,ing:L.goals.ing?{n:L.goals.ing,have:0}:null}};
  for(let c=0;c<N;c++){let t=-1,b=-1;for(let r=0;r<N;r++)if(L.mask[r][c]){if(t<0)t=r;b=r}S.top[c]=t;S.bot[c]=b}

function fillBoard(){
  const L=S.L;
  for(let tries=0;tries<80;tries++){
    S.idc=0;S.ingSpawned=0;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(!L.mask[r][c]){S.P[r][c]=null;continue}
      if(L.ice[r][c]){S.P[r][c]=newPiece(-2,'ice',L.ice[r][c]);continue}
      let t,k=0;const same=(a,b)=>S.P[a]&&S.P[a][b]&&S.P[a][b].t===t;
      do{t=rnd(L.colors);k++}while(k<40&&((c>1&&same(r,c-1)&&same(r,c-2))||(r>1&&same(r-1,c)&&same(r-2,c))));
      S.P[r][c]=newPiece(t);
    }
    if(S.g.ing){const cols=[];for(let c=0;c<N;c++)if(S.top[c]>=0)cols.push(c);
      for(let i=0;i<Math.min(2,S.g.ing.n);i++){const c=cols.splice(rnd(cols.length),1)[0],r=S.top[c];if(S.P[r][c].k==='n'){S.P[r][c]=newPiece(-3,'ing');S.ingSpawned++}}}
    if(!findRuns().length&&findMove())return;
  }
}

  const W=Math.min(scroll.clientWidth||380,560),step=96,padTop=130,padBot=110,H=padTop+padBot+(LEVELS-1)*step;
  inner.style.width=W+'px';inner.style.height=H+'px';
  const pts=[];for(let i=1;i<=LEVELS;i++)pts.push([W/2+Math.sin((i-1)*.9)*W*.27,H-padBot-(i-1)*step]);
  let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i],my=(y0+y1)/2;d+=` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`}
  let h=`<svg class="trail" width="${W}" height="${H}"><path class="t1" d="${d}"/><path class="t2" d="${d}"/></svg>`;
  for(let w=0;w<LEVELS/10;w++){const y=pts[w*10][1]+50;h+=`<div class="ribbon" style="top:${y-14}px">Mundo ${w+1} · ${WORLDS[w][0]}</div>`}
  const cur=Math.min(save.unlocked,LEVELS);
  pts.forEach(([x,y],i)=>{
    const n=i+1,st=save.stars[n]||0,locked=n>save.unlocked,isCur=n===cur&&!save.stars[n];
    h+=`<button class="node ${locked?'locked':isCur?'cur':'done'}" style="left:${x}px;top:${y}px" data-n="${n}" aria-label="Fase ${n}">${locked?'🔒':n}${isCur?'<span class="pointer">JOGAR</span>':''}${!locked&&st?`<span class="nst">${'★'.repeat(st)}<s>${'★'.repeat(3-st)}</s></span>`:''}</button>`;
  });
  inner.innerHTML=h;
  inner.querySelectorAll('.node').forEach(b=>b.onclick=()=>{ac();const n=+b.dataset.n;if(n>save.unlocked){toast('Complete a fase anterior para liberar!');sfx.bad();return}sfx.tap();openIntro(n)});
  requestAnimationFrame(()=>{scroll.scrollTop=Math.max(0,pts[cur-1][1]-scroll.clientHeight/2)});
}
window.addEventListener('resize',()=>{sizeFx();if($('#map').classList.contains('active'))buildMap()});

/* ================= FUNDO ANIMADO ================= */
(function bg(){
  const cv=$('#bg'),g=cv.getContext&&cv.getContext('2d');if(!g)return;
  let W=0,H=0,stars=[],flies=[];
  function size(){const dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6.28,s:.5+Math.random()*1.5}));
    flies=Array.from({length:16},()=>({x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.28,s:.15+Math.random()*.35,p:Math.random()*6.28}))}
  size();addEventListener('resize',size);
  let t=0;(function loop(){requestAnimationFrame(loop);if(document.hidden)return;t+=.016;g.clearRect(0,0,W,H);
    stars.forEach(s=>{g.globalAlpha=.35+.55*Math.abs(Math.sin(t*s.s+s.p));g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.r,0,6.283);g.fill()});
    flies.forEach(f=>{f.a+=(Math.random()-.5)*.1;f.x+=Math.cos(f.a)*f.s;f.y+=Math.sin(f.a)*f.s-.05;if(f.x<-10)f.x=W+10;if(f.x>W+10)f.x=-10;if(f.y<-10)f.y=H+10;if(f.y>H+10)f.y=-10;
      const a=.35+.5*Math.sin(t*1.7+f.p);const gr=g.createRadialGradient(f.x,f.y,0,f.x,f.y,11);gr.addColorStop(0,`rgba(255,236,150,${a})`);gr.addColorStop(1,'rgba(255,236,150,0)');g.globalAlpha=1;g.fillStyle=gr;g.beginPath();g.arc(f.x,f.y,11,0,6.283);g.fill()});
    g.globalAlpha=1})();
})();

/* ================= INÍCIO ================= */
refreshMapHeader();buildMap();setWorld(Math.floor((Math.min(save.unlocked,LEVELS)-1)/10));
setTimeout(dailyGift,500);
window.__jde={startLevel,get S(){return S},attempt,findMove,findRuns,getLevel,LEVELS,at,goalsMet,hud};
})();
